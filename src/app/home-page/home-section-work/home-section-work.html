<section class="slide work-slide">
  <div class="work-header">
    <h2>{{ t.work.title[lang()] }}</h2>
    <p class="work-subtitle">{{ t.work.subtitle[lang()] }}</p>
  </div>

  <div class="work-grid">
    @for (project of works; track project.id) {
      <div class="work-card" [routerLink]="['/portfolio', project.id]">
        <div class="work-image">
          <img [src]="project.image" [alt]="project.title[lang()]" />
        </div>
        <div class="work-content content-card">
          <h3>{{ project.title[lang()] }}</h3>
          <p>{{ project.description[lang()] }}</p>
          <div class="work-tags">
            @for (tag of project.tags; track tag) {
              <span class="tag">{{ tag }}</span>
            }
          </div>
        </div>
      </div>
    }

    <div class="work-card work-card-more" routerLink="/portfolio">
      <div class="more-content">
        <i class="pi pi-th-large more-icon"></i>
        <span class="more-label">{{ t.work.andMore[lang()] }}</span>
        <p class="more-description">{{ t.work.viewAll[lang()] }}</p>
        <i class="pi pi-arrow-right more-arrow"></i>
      </div>
    </div>
  </div>
</section>
