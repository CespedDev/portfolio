<section class="slide">
  <div class="hero-content">
    <p class="greeting">{{ 'hero.greeting' | translate }}</p>
    <h1 class="name">{{ 'hero.name' | translate }}</h1>
    <p class="title">{{ 'hero.title' | translate }}</p>
    <div class="hero-actions">
      <p-button
        [label]="'hero.viewWork' | translate"
        icon="pi pi-briefcase"
        (onClick)="scrollTo('.work-slide')" />
    </div>
  </div>

  <p-button
    class="scroll-indicator"
    icon="pi pi-chevron-down"
    [text]="true"
    [rounded]="true"
    [ariaLabel]="'hero.scrollDown' | translate"
    (onClick)="scrollTo('.about-slide')" />
</section>
