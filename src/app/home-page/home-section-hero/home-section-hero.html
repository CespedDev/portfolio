<section class="slide">
  <div class="hero-content">
    <p class="greeting">{{ t.hero.greeting[lang()] }}</p>
    <h1 class="name">Carlos Cabrera</h1>
    <p class="title">{{ t.hero.title[lang()] }}</p>
    <div class="hero-actions">
      <p-button
        [label]="t.hero.viewWork[lang()]"
        icon="pi pi-briefcase"
        (onClick)="scrollTo('.work-slide')" />
    </div>
  </div>

  <p-button
    class="scroll-indicator"
    icon="pi pi-chevron-down"
    [text]="true"
    [rounded]="true"
    [ariaLabel]="t.hero.scrollDown[lang()]"
    (onClick)="scrollTo('.about-slide')" />
</section>
