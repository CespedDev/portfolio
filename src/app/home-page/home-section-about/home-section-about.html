<section class="slide about-slide">
  <div class="about-left">
    <h2>{{ 'about.title' | translate }}</h2>
    <p class="about-text">
      {{ 'about.text' | translate }}
    </p>
    <div class="about-buttons">
      <p-button [label]="'about.contactMe' | translate" icon="pi pi-envelope" routerLink="/contact" />
      <a
        pButton
        [label]="'about.downloadCV' | translate"
        icon="pi pi-download"
        [outlined]="true"
        href="assets/docs/CV_Carlos_Cabrera.pdf"
        download></a>
    </div>
  </div>
  
  <div class="about-right">
    <div class="photo-container">
      <!-- <img src="/placeholder-photo.jpg" alt="Carlos Cabrera" /> -->
    </div>
  </div>
</section>
