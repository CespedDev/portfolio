<p-toolbar>
  <ng-template #center>
    <div class="topbar-content">
      <span class="topbar-title">Carlos Cabrera</span>
      
      <!-- Desktop Menu -->
      <div class="desktop-menu">
        <p-button [label]="'nav.home' | translate" icon="pi pi-home" [routerLink]="['/home']" text />
        <p-button [label]="'nav.portfolio' | translate" icon="pi pi-briefcase" text />
        <p-button [label]="'nav.hobbies' | translate" icon="pi pi-heart" text />
        <p-button [label]="'nav.bio' | translate" icon="pi pi-user" text />
        <p-button [label]="'nav.contact' | translate" icon="pi pi-envelope" text />
        <p-button [label]="'nav.downloadCV' | translate" icon="pi pi-download" outlined />
        
        <!-- Language Switcher -->
        <p-button 
          [label]="languageLabel()" 
          icon="pi pi-globe" 
          (onClick)="switchLanguage()" 
          text 
          styleClass="language-button"
        />
      </div>
      
      <!-- Mobile Hamburger -->
      <p-button 
        class="mobile-menu-button" 
        icon="pi pi-bars" 
        (onClick)="mobileMenuVisible.set(true)" 
        text 
      />
    </div>
  </ng-template>
</p-toolbar>

<!-- Mobile Drawer Menu -->
<p-drawer [visible]="mobileMenuVisible()" (visibleChange)="mobileMenuVisible.set($event)" position="right" [appendTo]="'body'">
  <ng-template #header>
    <span class="drawer-title">Menu</span>
  </ng-template>
  
  <div class="mobile-menu-items">
    <p-button 
      [label]="'nav.home' | translate" 
      icon="pi pi-home" 
      [routerLink]="['/home']" 
      (onClick)="mobileMenuVisible.set(false)"
      text 
      styleClass="mobile-menu-item"
    />
    <p-button 
      [label]="'nav.portfolio' | translate" 
      icon="pi pi-briefcase" 
      (onClick)="mobileMenuVisible.set(false)"
      text 
      styleClass="mobile-menu-item"
    />
    <p-button 
      [label]="'nav.hobbies' | translate" 
      icon="pi pi-heart" 
      (onClick)="mobileMenuVisible.set(false)"
      text 
      styleClass="mobile-menu-item"
    />
    <p-button 
      [label]="'nav.bio' | translate" 
      icon="pi pi-user" 
      (onClick)="mobileMenuVisible.set(false)"
      text 
      styleClass="mobile-menu-item"
    />
    <p-button 
      [label]="'nav.contact' | translate" 
      icon="pi pi-envelope" 
      (onClick)="mobileMenuVisible.set(false)"
      text 
      styleClass="mobile-menu-item"
    />
    <p-button 
      [label]="'nav.downloadCV' | translate" 
      icon="pi pi-download" 
      (onClick)="mobileMenuVisible.set(false)"
      outlined 
      styleClass="mobile-menu-item"
    />
    
    <!-- Language Switcher Mobile -->
    <p-button 
      [label]="languageLabel()" 
      icon="pi pi-globe" 
      (onClick)="switchLanguage()" 
      text 
      styleClass="mobile-menu-item language-button"
    />
  </div>
</p-drawer>
