<p-toolbar>
  <ng-template #center>
    <div class="topbar-content">
      <span class="topbar-title">Carlos Cabrera</span>

      <!-- Desktop Menu -->
      <div class="desktop-menu">
        <p-button [label]="t.nav.home[lang()]" icon="pi pi-home" [routerLink]="['/home']" routerLinkActive="active-nav" text />
        <p-button [label]="t.nav.portfolio[lang()]" icon="pi pi-briefcase" [routerLink]="['/portfolio']" routerLinkActive="active-nav" text />
        <p-button [label]="t.nav.hobbies[lang()]" icon="pi pi-heart" [routerLink]="['/hobbies']" routerLinkActive="active-nav" text />
        <p-button [label]="t.nav.bio[lang()]" icon="pi pi-user" [routerLink]="['/bio']" routerLinkActive="active-nav" text />
        <p-button [label]="t.nav.contact[lang()]" icon="pi pi-envelope" [routerLink]="['/contact']" routerLinkActive="active-nav" text />
        <a
          pButton
          [label]="t.nav.downloadCV[lang()]"
          icon="pi pi-download"
          [outlined]="true"
          href="assets/docs/CV_Carlos_Cabrera.pdf"
          download></a>

        <!-- Language Switcher -->
        <p-button
          [label]="languageLabel()"
          icon="pi pi-globe"
          (onClick)="switchLanguage()"
          text
          styleClass="language-button"
        />
      </div>

      <!-- Mobile Hamburger -->
      <p-button
        class="mobile-menu-button"
        icon="pi pi-bars"
        (onClick)="mobileMenuVisible.set(true)"
        text
      />
    </div>
  </ng-template>
</p-toolbar>

<!-- Mobile Drawer Menu -->
<p-drawer [visible]="mobileMenuVisible()" (visibleChange)="mobileMenuVisible.set($event)" position="right" [appendTo]="'body'">
  <ng-template #header>
    <span class="drawer-title">Menu</span>
  </ng-template>

  <div class="mobile-menu-items">
    <p-button
      [label]="t.nav.home[lang()]"
      icon="pi pi-home"
      [routerLink]="['/home']"
      routerLinkActive="active-nav"
      (onClick)="mobileMenuVisible.set(false)"
      text
      styleClass="mobile-menu-item"
    />
    <p-button
      [label]="t.nav.portfolio[lang()]"
      icon="pi pi-briefcase"
      [routerLink]="['/portfolio']"
      routerLinkActive="active-nav"
      (onClick)="mobileMenuVisible.set(false)"
      text
      styleClass="mobile-menu-item"
    />
    <p-button
      [label]="t.nav.hobbies[lang()]"
      icon="pi pi-heart"
      [routerLink]="['/hobbies']"
      routerLinkActive="active-nav"
      (onClick)="mobileMenuVisible.set(false)"
      text
      styleClass="mobile-menu-item"
    />
    <p-button
      [label]="t.nav.bio[lang()]"
      icon="pi pi-user"
      [routerLink]="['/bio']"
      routerLinkActive="active-nav"
      (onClick)="mobileMenuVisible.set(false)"
      text
      styleClass="mobile-menu-item"
    />
    <p-button
      [label]="t.nav.contact[lang()]"
      icon="pi pi-envelope"
      [routerLink]="['/contact']"
      routerLinkActive="active-nav"
      (onClick)="mobileMenuVisible.set(false)"
      text
      styleClass="mobile-menu-item"
    />
    <a
      pButton
      [label]="t.nav.downloadCV[lang()]"
      icon="pi pi-download"
      [outlined]="true"
      class="mobile-menu-item"
      href="assets/docs/CV_Carlos_Cabrera.pdf"
      download
      (click)="mobileMenuVisible.set(false)"></a>

    <!-- Language Switcher Mobile -->
    <p-button
      [label]="languageLabel()"
      icon="pi pi-globe"
      (onClick)="switchLanguage()"
      text
      styleClass="mobile-menu-item language-button"
    />
  </div>
</p-drawer>
