  <text x="300" y="690" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="44" font-weight="700" fill="#FBFBFF">Green Eagle</text>
  <text x="300" y="730" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="20" fill="#34d399" letter-spacing="4">SERIOUS GAME</text>
