<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="55%" stop-color="#1c1c1c"/>
      <stop offset="100%" stop-color="#12332a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#bg)"/>
  <!-- radar -->
  <g fill="none" stroke="#10b981">
    <circle cx="300" cy="300" r="150" stroke-width="2" opacity="0.35"/>
    <circle cx="300" cy="300" r="105" stroke-width="2" opacity="0.5"/>
    <circle cx="300" cy="300" r="60" stroke-width="2" opacity="0.7"/>
    <line x1="300" y1="150" x2="300" y2="450" stroke-width="1" opacity="0.3"/>
    <line x1="150" y1="300" x2="450" y2="300" stroke-width="1" opacity="0.3"/>
    <line x1="300" y1="300" x2="405" y2="195" stroke-width="3" opacity="0.9"/>
  </g>
  <circle cx="360" cy="250" r="6" fill="#34d399"/>
  <circle cx="240" cy="350" r="5" fill="#34d399" opacity="0.6"/>
  <!-- pista de aterrizaje -->
  <g stroke="#FBFBFF" opacity="0.8">
    <line x1="240" y1="640" x2="270" y2="500" stroke-width="4"/>
    <line x1="360" y1="640" x2="330" y2="500" stroke-width="4"/>
    <line x1="300" y1="620" x2="300" y2="595" stroke-width="5"/>
    <line x1="300" y1="575" x2="300" y2="550" stroke-width="5"/>
    <line x1="300" y1="530" x2="300" y2="510" stroke-width="5"/>
  </g>
  <text x="300" y="690" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="52" font-weight="700" fill="#FBFBFF">SIMFOR</text>
  <text x="300" y="730" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="20" fill="#34d399" letter-spacing="4">AIRPORT SIMULATOR</text>
</svg>
